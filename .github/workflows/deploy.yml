name: Deploy no GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Permissão mínima por padrão; o job "deploy" pede as extras só para ele
permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Job 1: gera o site e sobe o resultado como artifact "github-pages"
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BRAPI_TOKEN: ${{ secrets.VITE_BRAPI_TOKEN }}
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  # Job 2: só publica. Rodar separado do build dá tempo para o artifact ficar disponível
  # (no mesmo job, o deploy-pages às vezes procurava o artifact milésimos de segundo cedo demais).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
