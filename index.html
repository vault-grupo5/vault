<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B12" />
    <title>VAULT — Carteira de investimentos</title>
    <meta
      name="description"
      content="Acompanhe sua carteira de ações, FIIs e ETFs da B3 com cotações da brapi: patrimônio, lucro, distribuição e histórico. Os dados ficam só no seu navegador."
    />
    <!-- Como o link aparece quando é compartilhado (WhatsApp, redes sociais) -->
    <meta property="og:title" content="VAULT — Carteira de investimentos" />
    <meta property="og:description" content="Patrimônio, lucro e distribuição da sua carteira da B3, com cotações da brapi." />
    <meta property="og:type" content="website" />
    <!--
      Define o tema (claro/escuro) ANTES da página aparecer. Se fosse feito só pelo React,
      a pessoa veria um "flash" do tema escuro antes de trocar para o claro.
      Ordem: 1) escolha salva pelo botão do tema; 2) preferência do sistema; 3) escuro.
    -->
    <script>
      try {
        var salvo = localStorage.getItem('vault:tema')
        var claro = window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.tema = salvo === 'claro' || salvo === 'escuro' ? salvo : claro ? 'claro' : 'escuro'
      } catch (erro) {
        document.documentElement.dataset.tema = 'escuro'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
